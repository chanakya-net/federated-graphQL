server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. With a variable in proxy_pass, nginx resolves fusion-gateway per request
  # (cached 10 s), so it starts without the gateway and follows it when the container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://fusion-gateway:8080;

  # Written by token-generator into the shared `tokens` volume (contracts/tokens.json.md).
  location = /tokens.json {
    alias /tokens/tokens.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # POST /graphql and GET /graphql/ (Nitro and its assets). `^~`: the asset regex below must not
  # catch /graphql/*.js. No URI part in proxy_pass: the request URI is passed on unchanged.
  location ^~ /graphql {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # Hashed bundles never change; index.html must always be revalidated.
  location ~* \.(?:js|css|woff2?|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
